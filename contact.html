<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
</head>
<body>
    <div>
        <h1>AurumSound</h1>
        <nav>
            <a href="index.html">Main</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
    <main>
        <div>
            <h1>Contact Us</h1>
        </div>
        <div>
            <form>
                <fieldset>
                    <legend>Join our music label!</legend>

                    <label for="artist-name">Artist name: </label><br>
                    <input type="text"
                           id="artist-name"
                           name="artist-name"
                           placeholder="Georg Trenkle"
                           maxlength="50"
                           required>
                    <br>

                    <label for="email">Email: </label><br>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="artist@example.com"
                           required>
                    <br>

                    <label for="demo-url">Link to portfolio/demo: </label><br>
                    <input type="url"
                           id="demo-url"
                           name="demo-url"
                           placeholder="https://soundcloud.com/your-demo"
                           required>
                    <br>

                    <label for="experience">Years of active music experience: </label><br>
                    <input type="number"
                           id="experience"
                           name="experience"
                           min="0" max="50"
                           value="1">
                    <br>
                </fieldset>

                <fieldset>
                    <legend>Membership Tier:</legend>

                    <input type="radio" id="tier-standard" name="tier" value="standard" checked>
                    <label for="tier-standard">Standard Artist</label><br>

                    <input type="radio" id="tier-label-member" name="tier" value="label_member">
                    <label for="tier-label-member">Label Member (Discounted Distribution & Higher Royalty)</label>
                </fieldset>

                <label for="about">Tell us about your music & future releases: </label><br>
                <textarea id="about"
                          name="about"
                          cols="40" rows="10"
                          maxlength="500"
                          placeholder="Describe your sound, upcoming singles or EPs..."></textarea>

                <div>
                    <button type="submit">Submit application!</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
